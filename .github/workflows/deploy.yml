name: Build and deploy EC2 pilot
on:
  push:
    branches: [main]
    paths-ignore: ['.bootstrap/**', 'docs/**', '*.md', 'README.txt']
  workflow_dispatch:
concurrency:
  group: open-harness-production
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ca-central-1
  AWS_ROLE_ARN: arn:aws:iam::807467871114:role/open-harness/GitHubActions-OpenHarnessDeploy
  ECR_REGISTRY: 807467871114.dkr.ecr.ca-central-1.amazonaws.com
  ECR_REPOSITORY: open-harness/librechat
  INSTANCE_ID: i-03a2c308345461f07
  SSM_DOCUMENT: OpenHarness-DeployRelease
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/LibreChat/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund --prefix src/LibreChat
      - name: Validate integration and build workspace packages
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm run build:packages --prefix src/LibreChat
          npm run test:integration
          npm run typecheck:integration
          node src/LibreChat/node_modules/typescript/bin/tsc --noEmit -p src/LibreChat/packages/api/tsconfig.json
          node src/LibreChat/node_modules/typescript/bin/tsc --noEmit -p src/LibreChat/packages/data-schemas/tsconfig.json
          node src/LibreChat/node_modules/typescript/bin/tsc --noEmit -p src/LibreChat/client/tsconfig.json
          cd src/LibreChat/packages/api
          node ../../node_modules/jest/bin/jest.js --config jest.config.mjs --runInBand src/utils/env.spec.ts --coverage=false
          cd ../data-schemas
          node ../../node_modules/jest/bin/jest.js --config jest.config.mjs --runInBand src/methods/user.methods.spec.ts --testNamePattern='links a local organization' --coverage=false
          cd ../../client
          node ../node_modules/jest/bin/jest.js --config jest.config.cjs --runInBand src/components/Platform/index.spec.tsx src/components/Organization/index.spec.tsx src/components/Hermes/HermesWorkspace.spec.tsx src/components/Hermes/theme.spec.ts src/components/Hermes/Progress.spec.tsx src/components/Chat/__tests__/ChatView.spec.tsx src/components/UnifiedSidebar/__tests__/ExpandedPanel.spec.tsx src/components/Share/ShareView.spec.tsx src/components/Share/ShareView.highlight.spec.tsx src/utils/__tests__/artifacts.test.ts src/lib/rum/privacy.spec.ts --coverage=false
      - name: Validate rollout scripts
        run: |
          bash -n deployment/deploy-release.sh
          node --check deployment/verify-live.cjs
          python3 -m py_compile deployment/control/engine.py deployment/control/server.py deployment/control/install.py
          cd deployment/control && python3 -m unittest test_engine -v
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: OpenHarness-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: src/LibreChat
          file: src/LibreChat/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:git-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_BRANCH=main
            NODE_MAX_OLD_SPACE_SIZE=6144
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy and verify through Systems Manager
        env:
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          command_id=$(aws ssm send-command --document-name "$SSM_DOCUMENT" --instance-ids "$INSTANCE_ID" \
            --parameters "CommitSha=$GITHUB_SHA,ImageDigest=$RELEASE_DIGEST" \
            --comment "Open Harness $GITHUB_SHA" --query Command.CommandId --output text)
          for attempt in $(seq 1 210); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
            esac
            sleep 6
          done
          echo 'Deployment verification timed out; inspect the SSM command before retrying.' >&2
          exit 1
